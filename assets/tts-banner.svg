<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">Kadir Nar — Giving text a little voice.</title>
  <desc id="banner-desc">A warm cream banner about TTS models, audio codecs, and voice cloning, with a smiling lavender cloud wearing headphones and a small audio waveform.</desc>

  <defs>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(956 191) rotate(90) scale(181 224)">
      <stop stop-color="#E9E2FC"/>
      <stop offset="1" stop-color="#E9E2FC" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="1" y="1" width="1198" height="358" rx="28" fill="#FBF8F2" stroke="#E9E3DC" stroke-width="2"/>
  <rect x="715" y="26" width="420" height="308" rx="154" fill="url(#halo)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <circle cx="70" cy="64" r="6" fill="#82B9A2"/>
    <text x="91" y="71" fill="#585466" font-size="19" font-weight="650" letter-spacing="3">KADIR NAR</text>
    <text x="64" y="155" fill="#2E2A3E" font-size="65" font-weight="750" letter-spacing="-2.5">Giving text</text>
    <text x="64" y="225" fill="#2E2A3E" font-size="65" font-weight="750" letter-spacing="-2.5">a little voice.</text>
    <text x="65" y="286" fill="#6E687A" font-size="21" font-weight="450">TTS models · Audio codecs · Voice cloning</text>
  </g>

